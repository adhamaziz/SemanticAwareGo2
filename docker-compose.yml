services:
  unitree_go2_dev:
    build: .
    container_name: jazzy_unitree_go2
    image: jazzy_unitree_go2_image
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/home/ros2_ws
    devices:
      - /dev/dri:/dev/dri # Passes through graphics hardware for seamless RViz/Gazebo movement
    privileged: true
    stdin_open: true
    tty: true
    command: /bin/bash