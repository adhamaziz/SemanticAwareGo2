# ros_gz_bridge config for the D435i RGBD sensor.
# Usage: add a bridge node to your bringup launch file pointing at this file,
# or run directly:
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=d435i_bridge.yaml

- ros_topic_name: "/d435i/color/image_raw"
  gz_topic_name: "/d435i/rgbd/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/d435i/color/camera_info"
  gz_topic_name: "/d435i/rgbd/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/d435i/depth/image_raw"
  gz_topic_name: "/d435i/rgbd/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/d435i/depth/points"
  gz_topic_name: "/d435i/rgbd/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom/gz"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
